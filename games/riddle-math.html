<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Adventurer | Riddle Quest</title>
    <style>
        :root {
            --bg-color: #0a0b10;
            --card-bg: #161b22;
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --neon-red: #ff3131;
            --text-color: #e6edf3;
            --accent: #39ff14;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* UI Layout */
        #game-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 900px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0b10 100%);
            border: 1px solid #30363d;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Header Stats */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #30363d;
        }

        .stat-box { font-weight: bold; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .neon-text { text-shadow: 0 0 10px var(--neon-blue); color: var(--neon-blue); }

        /* Story/Lore Area */
        #story-display {
            font-style: italic;
            color: #8b949e;
            font-size: 0.9rem;
            text-align: center;
            margin: 15px 0;
            min-height: 40px;
        }

        /* Puzzle Box */
        #puzzle-card {
            flex-grow: 1;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
            transition: transform 0.3s ease;
        }

        #puzzle-question {
            font-size: 1.4rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Inputs */
        input[type="text"], input[type="number"] {
            width: 100%;
            background: #0d1117;
            border: 2px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            color: white;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus { border-color: var(--neon-purple); }

        .btn-group {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .primary-btn { background: var(--neon-blue); color: black; }
        .secondary-btn { background: transparent; border: 1px solid var(--neon-purple); color: var(--neon-purple); }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Timer Bar */
        #timer-container {
            width: 100%;
            height: 4px;
            background: #30363d;
            margin-top: 20px;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }
        #timer-bar { width: 100%; height: 100%; background: var(--neon-red); transition: width 0.1s linear; }

        /* Notifications */
        #feedback {
            margin-top: 15px;
            font-weight: bold;
            height: 20px;
            font-size: 0.9rem;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both; }

        .correct { color: var(--accent); }
        .wrong { color: var(--neon-red); }

        /* Responsive */
        @media (max-height: 600px) {
            #game-container { padding: 10px; }
            #puzzle-question { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">
        <div class="stat-box">HP: <span id="hp-val" class="neon-text">3</span></div>
        <div class="stat-box">LVL: <span id="lvl-val" class="neon-text">1</span></div>
        <div class="stat-box">STREAK: <span id="streak-val" class="neon-text">0</span></div>
    </div>

    <div id="story-display">Mempersiapkan petualangan...</div>

    <div id="puzzle-card">
        <div id="puzzle-type" style="font-size: 0.7rem; color: var(--neon-purple); margin-bottom: 10px; letter-spacing: 2px;">LOGIC GATE</div>
        <div id="puzzle-question">Loading puzzle...</div>
        
        <input type="text" id="answer-input" placeholder="Ketik jawaban..." autocomplete="off">
        
        <div id="timer-container"><div id="timer-bar"></div></div>

        <div id="feedback"></div>

        <div class="btn-group">
            <button id="hint-btn" class="secondary-btn" onclick="useHint()">HINT</button>
            <button id="submit-btn" class="primary-btn" onclick="checkAnswer()">SUBMIT</button>
        </div>
    </div>
</div>

<script>
    // --- GAME STATE ---
    let state = {
        lvl: 1,
        hp: 3,
        streak: 0,
        score: 0,
        currentPuzzle: {},
        difficulty: 1, // 1 to 10
        hintAvailable: true,
        timer: null,
        timeLeft: 0,
        isTwist: false
    };

    const LORE = [
        "Kamu terbangun di gerbang dimensi yang bergetar...",
        "Udara di sini terasa dingin dan penuh kode biner.",
        "Dinding-dinding ruangan ini bergeser mengikuti pikiranmu.",
        "Suara bisikan terdengar: 'Hanya logika yang bisa membebaskanmu'.",
        "Ada jejak adventurer sebelumnya, tapi berakhir di level ini.",
        "Tekanan udara meningkat, gravitasi mulai kacau."
    ];

    // --- PUZZLE GENERATORS ---
    const PuzzleFactory = {
        math: (diff) => {
            const a = Math.floor(Math.random() * (10 * diff)) + 2;
            const b = Math.floor(Math.random() * (5 * diff)) + 2;
            const ops = ['+', '-', '*'];
            const op = ops[Math.floor(Math.random() * (diff > 3 ? 3 : 2))];
            let ans;
            if(op === '+') ans = a + b;
            else if(op === '-') ans = a - b;
            else ans = a * b;

            return {
                q: `Hasil dari ${a} ${op} ${b} adalah?`,
                a: ans.toString(),
                hint: `Gunakan kalkulasi dasar ${op === '*' ? 'perkalian' : 'aritmatika'}.`,
                type: "CALCULATION"
            };
        },
        sequence: (diff) => {
            const start = Math.floor(Math.random() * 10);
            const step = Math.floor(Math.random() * diff) + 2;
            const seq = [start, start + step, start + (step * 2), start + (step * 3)];
            return {
                q: `Lengkapi pola: ${seq[0]}, ${seq[1]}, ${seq[2]}, ?`,
                a: seq[3].toString(),
                hint: `Coba kurangi angka kedua dengan angka pertama.`,
                type: "PATTERN"
            };
        },
        riddle: (diff) => {
            const riddles = [
                {q: "Aku punya kota, tapi tak punya rumah. Aku punya gunung, tapi tak punya pohon. Siapa aku?", a: "peta", h: "Aku terbuat dari kertas atau layar."},
                {q: "Semakin banyak kamu mengambilnya, semakin besar aku tertinggal. Apa itu?", a: "langkah", h: "Berhubungan dengan kaki."},
                {q: "Aku selalu ada di depanmu tapi tidak bisa dilihat. Apa aku?", a: "masa depan", h: "Waktu."},
                {q: "Apa yang memiliki kunci tapi tidak bisa membuka gembok?", a: "piano", h: "Alat musik."},
                {q: "Jika 1=5, 2=25, 3=125, maka 5=?", a: "1", h: "Baca kalimat pertamanya baik-baik."}D
            ];
            return riddles[Math.floor(Math.random() * riddles.length)];
        },
        scramble: (diff) => {
            const words = ["ADVENTURE", "DIMENSI", "LOGIKA", "RAHASIA", "PUZZLE", "CYBER"];
            const word = words[Math.floor(Math.random() * words.length)];
            const scrambled = word.split('').sort(() => Math.random() - 0.5).join('');
            return {
                q: `Susun kata: ${scrambled}`,
                a: word.toLowerCase(),
                hint: "Ini adalah istilah dalam penjelajahan.",
                type: "ANAGRAM"
            };
        }
    };

    // --- CORE FUNCTIONS ---
    function init() {
        loadGame();
        generateLevel();
        
        // Handle Enter Key
        document.getElementById('answer-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });
    }

    function generateLevel() {
        clearInterval(state.timer);
        const card = document.getElementById('puzzle-card');
        const input = document.getElementById('answer-input');
        const timerCont = document.getElementById('timer-container');
        
        card.classList.remove('shake');
        input.value = "";
        input.focus();
        document.getElementById('feedback').innerText = "";
        
        // Narrative Twist
        if (state.lvl % 5 === 0) {
            document.getElementById('story-display').innerText = LORE[Math.min(Math.floor(state.lvl/5), LORE.length-1)];
        } else {
            document.getElementById('story-display').innerText = "Menjelajahi koridor level " + state.lvl;
        }

        // Randomize Puzzle Type
        const types = ['math', 'sequence', 'riddle', 'scramble'];
        const randomType = types[Math.floor(Math.random() * types.length)];
        state.currentPuzzle = PuzzleFactory[randomType](state.difficulty);
        
        // UI Update
        document.getElementById('lvl-val').innerText = state.lvl;
        document.getElementById('hp-val').innerText = state.hp;
        document.getElementById('streak-val').innerText = state.streak;
        document.getElementById('puzzle-question').innerText = state.currentPuzzle.q;
        document.getElementById('puzzle-type').innerText = state.currentPuzzle.type || "MYSTERY";
        
        // Mini Challenge (Time Pressure)
        if (state.lvl > 3 && Math.random() > 0.7) {
            startTimer();
            timerCont.style.display = 'block';
            state.isTwist = true;
            document.getElementById('puzzle-type').innerText += " [TIME ATTACK]";
        } else {
            timerCont.style.display = 'none';
            state.isTwist = false;
        }

        state.hintAvailable = true;
        document.getElementById('hint-btn').disabled = false;
    }

    function startTimer() {
        state.timeLeft = 100;
        const bar = document.getElementById('timer-bar');
        state.timer = setInterval(() => {
            state.timeLeft -= 1;
            bar.style.width = state.timeLeft + "%";
            if (state.timeLeft <= 0) {
                clearInterval(state.timer);
                handleWrong("Waktu Habis!");
            }
        }, 150 - (state.difficulty * 5));
    }

    function checkAnswer() {
        const userAns = document.getElementById('answer-input').value.toLowerCase().trim();
        const correctAns = state.currentPuzzle.a.toLowerCase();

        if (userAns === correctAns) {
            handleCorrect();
        } else {
            handleWrong("Jawaban Salah!");
        }
    }

    function handleCorrect() {
        state.streak++;
        state.lvl++;
        state.score += (10 * state.streak);
        
        // Adaptive difficulty
        if(state.streak > 3) state.difficulty = Math.min(state.difficulty + 1, 10);
        
        document.getElementById('feedback').className = "correct";
        document.getElementById('feedback').innerText = "✓ BERHASIL!";
        
        saveGame();
        setTimeout(generateLevel, 1000);
    }

    function handleWrong(msg) {
        state.hp--;
        state.streak = 0;
        state.difficulty = Math.max(state.difficulty - 1, 1);
        
        document.getElementById('puzzle-card').classList.add('shake');
        document.getElementById('feedback').className = "wrong";
        document.getElementById('feedback').innerText = `✗ ${msg}`;
        document.getElementById('hp-val').innerText = state.hp;

        if (state.hp <= 0) {
            setTimeout(gameOver, 500);
        } else {
            setTimeout(() => {
                document.getElementById('puzzle-card').classList.remove('shake');
                if(state.isTwist) generateLevel(); // New puzzle if timer ran out
            }, 500);
        }
    }

    function useHint() {
        if (state.hintAvailable) {
            document.getElementById('feedback').className = "";
            document.getElementById('feedback').innerText = `HINT: ${state.currentPuzzle.hint}`;
            state.hintAvailable = false;
            document.getElementById('hint-btn').disabled = true;
            state.score -= 5;
        }
    }

    function gameOver() {
        alert(`GAME OVER!\nLevel Terakhir: ${state.lvl}\nSkor: ${state.score}`);
        state = {
            lvl: 1, hp: 3, streak: 0, score: 0, difficulty: 1, 
            hintAvailable: true, timer: null, timeLeft: 0, isTwist: false
        };
        localStorage.removeItem('adv_quest_save');
        generateLevel();
    }

    // --- STORAGE ---
    function saveGame() {
        const data = JSON.stringify({
            lvl: state.lvl,
            score: state.score,
            diff: state.difficulty
        });
        localStorage.setItem('adv_quest_save', data);
    }

    function loadGame() {
        const saved = localStorage.getItem('adv_quest_save');
        if (saved) {
            const data = JSON.parse(saved);
            state.lvl = data.lvl;
            state.score = data.score;
            state.difficulty = data.diff;
        }
    }

    // Start the game
    window.onload = init;
</script>

</body>
</html>

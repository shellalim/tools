<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL Portal | Game Launcher UI</title>
    <style>
        :root {
            /* Default Theme: Deep Blue */
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --accent-primary: #00f2ff;
            --accent-secondary: #7000ff;
            --text-main: #e6edf3;
            --text-dim: #8b949e;
            --glow: 0 0 15px rgba(0, 242, 255, 0.4);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Pink/Cyber Theme */
        [data-theme="cyber"] {
            --bg-color: #1a0b1a;
            --card-bg: #2d162d;
            --accent-primary: #ff00ea;
            --accent-secondary: #00f2ff;
            --glow: 0 0 15px rgba(255, 0, 234, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.5s ease;
        }

        /* Floating Theme Toggle */
        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--card-bg);
            border: 1px solid var(--accent-primary);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--glow);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .theme-switch:hover {
            transform: scale(1.1) rotate(15deg);
        }

        .theme-icon {
            font-size: 1.5rem;
        }

        header {
            padding: 60px 20px 40px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(112, 0, 255, 0.1), transparent);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            filter: drop-shadow(var(--glow));
        }

        .subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 30px; }

        .controls { max-width: 800px; margin: 0 auto 40px auto; padding: 0 20px; width: 100%; }

        #search-input {
            width: 100%; padding: 15px 25px; background: var(--card-bg);
            border: 1px solid #30363d; border-radius: 12px; color: white;
            font-size: 1rem; transition: var(--transition); outline: none;
        }

        #search-input:focus { border-color: var(--accent-primary); box-shadow: var(--glow); }

        .filters { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px;}

        .filter-btn {
            padding: 8px 20px; background: transparent; border: 1px solid #30363d;
            border-radius: 20px; color: var(--text-dim); cursor: pointer;
            transition: var(--transition); font-size: 0.85rem;
        }

        .filter-btn.active, .filter-btn:hover {
            background: rgba(var(--accent-primary), 0.1);
            color: var(--accent-primary); border-color: var(--accent-primary);
        }

        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px 20px; width: 100%; }

        .page-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px;
        }

        .card {
            background: var(--card-bg); border-radius: 16px; overflow: hidden;
            border: 1px solid #30363d; cursor: pointer; transition: var(--transition);
            display: flex; flex-direction: column; animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card:hover {
            transform: translateY(-8px); border-color: var(--accent-primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(var(--accent-primary), 0.2);
        }

        .card-image {
            height: 140px; background: rgba(255, 255, 255, 0.02);
            display: flex; align-items: center; justify-content: center;
        }

        .card-icon { font-size: 3rem; opacity: 0.5; transition: var(--transition); }
        .card:hover .card-icon { opacity: 1; filter: drop-shadow(var(--glow)); }

        .card-content { padding: 20px; }
        .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
        .card-desc { font-size: 0.9rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 15px; }
        
        .tag {
            font-size: 0.7rem; background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px; border-radius: 4px; color: var(--accent-primary);
        }

        .highlight { background-color: var(--accent-primary); color: #000; border-radius: 2px; }

        footer { padding: 30px; text-align: center; color: var(--text-dim); font-size: 0.8rem; }
    </style>
</head>
<body>

    <button class="theme-switch" id="theme-toggle" title="Ganti Tema">
        <span class="theme-icon">💎</span>
    </button>

    <header>
        <div class="logo">SHELLA LIM GAME PORTAL</div>
        <p class="subtitle">System Portal & Application Launcher</p>
    </header>

    <div class="controls">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Cari halaman...">
        </div>
        <div class="filters" id="filter-container">
            <button class="filter-btn active" data-category="all">Semua</button>
        </div>
    </div>

    <main class="main-container">
        <div class="page-grid" id="page-grid"></div>
    </main>

    <footer>&copy; 2026 Shella Lim Game Portal Launcher</footer>

    <script>
        const PAGES_DATA = [
            
            { name: "Panda Fish", file: "panda-fish.html", desc: "Catch your fish with panda", category: "Game", icon: "🚀" },
            { name: "Adventurer Riddle Game", file: "riddle-math.html", desc: "Adventure's Riddle Challenge", category: "Game", icon: "🚀" },
            { name: "Dark Realm: Chronicles of the Fallen", file: "adventure-dr.html", desc: "a full Dark Fantasy RPG with card-based combat, story quests.", category: "Game", icon: "🚀" },
            { name: "Scramble words", file: "scramble-words.html", desc: "Word scramble challenge.", category: "Game", icon: "📦" },
            { name: "Deep Sea Path", file: "deep-sea.html", desc: "Find the path challenge", category: "Game", icon: "🚀" },
            { name: "Cyber Security Lab", file: "lab.html", desc: "Simulasi kerentanan sistem.", category: "Security", icon: "🛡️" },
            { name: "Inventory System", file: "inventory.html", desc: "Database stok barang logistik.", category: "Tool", icon: "📦" }
        ];

        let currentFilter = 'all';
        let searchQuery = '';

        // --- THEME LOGIC ---
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = themeToggle.querySelector('.theme-icon');
        
        // Cek LocalStorage
        const savedTheme = localStorage.getItem('nexus-theme') || 'default';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'default' ? 'cyber' : 'default';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('nexus-theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            themeIcon.textContent = theme === 'default' ? '💎' : '🌸';
        }

        // --- RENDER LOGIC ---
        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, `<span class="highlight">$1</span>`);
        }

        function renderGrid() {
            const grid = document.getElementById('page-grid');
            grid.innerHTML = '';

            const filtered = PAGES_DATA.filter(page => {
                const matchesCategory = currentFilter === 'all' || page.category === currentFilter;
                const matchesSearch = page.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     page.desc.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            filtered.forEach((page, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.innerHTML = `
                    <div class="card-image"><div class="card-icon">${page.icon}</div></div>
                    <div class="card-content">
                        <h3 class="card-title">${highlightText(page.name, searchQuery)}</h3>
                        <p class="card-desc">${highlightText(page.desc, searchQuery)}</p>
                        <span class="tag">${page.category}</span>
                    </div>
                `;
                card.onclick = () => window.location.href = page.file;
                grid.appendChild(card);
            });
        }

        function renderCategories() {
            const container = document.getElementById('filter-container');
            const categories = ['all', ...new Set(PAGES_DATA.map(p => p.category))];
            container.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${currentFilter === cat ? 'active' : ''}`;
                btn.textContent = cat.toUpperCase();
                btn.onclick = () => {
                    currentFilter = cat;
                    renderCategories();
                    renderGrid();
                };
                container.appendChild(btn);
            });
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGrid();
        });

        window.onload = () => { renderCategories(); renderGrid(); };
    </script>
</body>
</html>
